# NewsPulse 24 — nginx
#
# The Node app binds 127.0.0.1:3000 and is not reachable from the internet; nginx is the
# only thing facing the network. Install with:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/newspulse24
#   sudo ln -s /etc/nginx/sites-available/newspulse24 /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d news.example.com

# Two rate-limit zones as an outer layer in front of the app's own limiter. The app still
# rate-limits on its own; this stops abusive traffic before it reaches Node at all.
limit_req_zone $binary_remote_addr zone=np_login:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=np_write:10m  rate=30r/m;

# Connection limits blunt slowloris-style attacks at the edge.
limit_conn_zone $binary_remote_addr zone=np_conn:10m;

upstream newspulse24 {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name news.example.com;

    # Let's Encrypt needs this path before the redirect.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name news.example.com;

    ssl_certificate     /etc/letsencrypt/live/news.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Matches UPLOAD_MAX_MB. Larger bodies are rejected here, before Node parses them.
    client_max_body_size 8m;
    client_body_timeout  30s;
    client_header_timeout 20s;
    send_timeout 30s;

    limit_conn np_conn 30;

    # ---------------------------------------------------------------- gzip --
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml application/rss+xml application/manifest+json image/svg+xml;

    # ------------------------------------------------------- static assets --
    # Versioned by query string (site.css?v=1.0.0), so a deploy invalidates them
    # without a purge.
    location /assets/ {
        alias /var/www/newspulse24/src/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------- never-cache routes ---
    # The ticker and the ad frame must be fresh on every request, or an editor's
    # breaking news will never appear.
    location ~ ^/(api/|ads/frame/|healthz) {
        add_header Cache-Control "no-store" always;
        limit_req zone=np_write burst=20 nodelay;
        proxy_pass http://newspulse24;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # The AI assistant streams SSE; buffering would hold the tokens back.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # The newsletter assistant endpoint also streams.
    location = /api/assistant/stream {
        add_header Cache-Control "no-store" always;
        proxy_pass http://newspulse24;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ---------------------------------------------------- login throttling --
    location = /admin/login {
        limit_req zone=np_login burst=3 nodelay;
        proxy_pass http://newspulse24;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------- everything ---
    location / {
        proxy_pass http://newspulse24;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    # Headers for anything nginx serves directly. The app sets its own on proxied
    # responses, so these only cover error pages and static files.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Never expose dotfiles.
    location ~ /\. { deny all; }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
